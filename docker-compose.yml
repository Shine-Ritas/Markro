services:
  postgres:
    image: postgres:16-alpine
    container_name: luckdraw-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: luckdraw
      POSTGRES_PASSWORD: luckdraw
      POSTGRES_DB: luckdraw
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U luckdraw -d luckdraw"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
